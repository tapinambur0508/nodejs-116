tags:
  - Students
summary: Get student by id
operationId: getStudent
description: Get student by id
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 68efd41636a23320bb4ef586
responses:
  '200':
    description: Successfully get student by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get student by id
            data:
              $ref: ../../../components/schemas/student.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Student not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Student not found
  '500':
    $ref: ../../../components/responses/500.yaml
